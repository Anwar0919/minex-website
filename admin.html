
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MineX Admin Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#0b1220;color:#e8eefc;font-family:Arial,sans-serif}
.container{max-width:1000px;margin:auto}
h1{color:#42e8a5}
.card{background:#172338;padding:18px;border-radius:12px;margin:15px 0}
button{padding:11px 16px;border:0;border-radius:8px;background:#42e8a5;color:#07130f;font-weight:bold;margin:5px;cursor:pointer}
button.secondary{background:#33445e;color:white}
#status{color:#ffd166}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{text-align:left;padding:11px;border-bottom:1px solid #34445b;font-size:14px}
th{color:#42e8a5}
.tablewrap{overflow-x:auto}
.small{color:#aab8ce;font-size:13px}
</style>
</head>
<body>
<div class="container">
<h1>MineX Admin Dashboard</h1>
<p class="small">Owner-only access • Read-only user overview</p>

<div class="card">
<h2>Admin Status</h2>
<p id="status">Checking account...</p>
<p id="adminEmail"></p>
<button id="refreshBtn" style="display:none">Refresh Users</button>
<button id="logoutBtn" class="secondary" style="display:none">Logout</button>
</div>

<div class="card" id="usersCard" style="display:none">
<h2>Registered Users: <span id="totalUsers">0</span></h2>
<div class="tablewrap">
<table>
<thead>
<tr>
<th>Name</th>
<th>Username</th>
<th>Email</th>
<th>Country</th>
<th>Gender</th>
</tr>
</thead>
<tbody id="usersList"></tbody>
</table>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {
 apiKey:"AIzaSyAGY2itBBkwbhoCpjObIdTXSD3YXrPGpAU",
 authDomain:"minex-ebe70.firebaseapp.com",
 projectId:"minex-ebe70",
 storageBucket:"minex-ebe70.firebasestorage.app",
 messagingSenderId:"753657680941",
 appId:"1:753657680941:web:48b000d2e53bb8d3ed54a4",
 measurementId:"G-9TGDN4GTN4"
};

const OWNER_UID = "oBZBNGvyXUS2OjgyrgIHQRyoB6p1";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const statusText = document.getElementById("status");
const usersCard = document.getElementById("usersCard");
const usersList = document.getElementById("usersList");
const totalUsers = document.getElementById("totalUsers");
const refreshBtn = document.getElementById("refreshBtn");
const logoutBtn = document.getElementById("logoutBtn");

function showStatus(message){
 statusText.textContent = message;
}

async function loadUsers(){
 showStatus("Loading users...");
 usersList.replaceChildren();

 try{
  const snapshot = await getDocs(collection(db,"users"));
  totalUsers.textContent = snapshot.size;

  snapshot.forEach((userDoc)=>{
   const data = userDoc.data();
   const tr = document.createElement("tr");

   [data.fullName,data.username,data.email,data.country,data.gender]
    .forEach(value=>{
      const td = document.createElement("td");
      td.textContent = value || "-";
      tr.appendChild(td);
    });

   usersList.appendChild(tr);
  });

  usersCard.style.display = "block";
  showStatus("Admin access verified. Users loaded.");
 }catch(error){
  console.error(error);
  showStatus("Could not load users. Check Firestore Rules or internet connection. " + error.message);
 }
}

onAuthStateChanged(auth, async (user)=>{
 usersCard.style.display = "none";
 refreshBtn.style.display = "none";
 logoutBtn.style.display = "none";

 if(!user){
  document.getElementById("adminEmail").textContent = "";
  showStatus("Please login first. Open the MineX main website.");
  return;
 }

 if(user.uid !== OWNER_UID){
  document.getElementById("adminEmail").textContent = "";
  showStatus("Access Denied. This account is not the MineX owner.");
  return;
 }

 document.getElementById("adminEmail").textContent = "Owner: " + user.email;
 refreshBtn.style.display = "inline-block";
 logoutBtn.style.display = "inline-block";
 await loadUsers();
});

refreshBtn.addEventListener("click",loadUsers);

logoutBtn.addEventListener("click",async ()=>{
 await signOut(auth);
 window.location.href = "./index.html";
});
</script>
</body>
  </html>
